name: Sandbox

on:
  pull_request:
    paths:
      - ".github/workflows/sandbox.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "internal/coding/execution/**"
      - "internal/coding/approval/**"
      - "internal/coding/changes/**"
      - "internal/coding/tools/**"
      - "internal/coding/workspace/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sandbox.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "internal/coding/execution/**"
      - "internal/coding/approval/**"
      - "internal/coding/changes/**"
      - "internal/coding/tools/**"
      - "internal/coding/workspace/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux sandbox (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install external sandbox runtime
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Record Linux sandbox host
        run: |
          cat /etc/os-release
          uname -a
          go version
          bwrap --version
      - name: Test execution package
        run: go test -race ./internal/coding/execution/... ./internal/coding/approval/... ./internal/coding/changes/... ./internal/coding/tools/...
      - name: Test real Linux sandbox
        run: make sandbox-smoke

  macos:
    name: macOS sandbox (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test execution package
        run: go test -race ./internal/coding/execution/... ./internal/coding/approval/... ./internal/coding/changes/... ./internal/coding/tools/...
      - name: Test real macOS sandbox
        run: make sandbox-smoke
