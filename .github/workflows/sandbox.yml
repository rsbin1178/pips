name: Sandbox

on:
  pull_request:
    paths:
      - ".github/workflows/sandbox.yml"
      - ".github/scripts/go-test.sh"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "internal/coding/execution/**"
      - "internal/coding/approval/**"
      - "internal/coding/changes/**"
      - "internal/coding/tools/**"
      - "internal/coding/workspace/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sandbox.yml"
      - ".github/scripts/go-test.sh"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "internal/coding/execution/**"
      - "internal/coding/approval/**"
      - "internal/coding/changes/**"
      - "internal/coding/tools/**"
      - "internal/coding/workspace/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux sandbox (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install external sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1"; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Record Linux sandbox host
        run: |
          cat /etc/os-release
          uname -a
          go version
          bwrap --version
      - name: Test execution package
        run: bash .github/scripts/go-test.sh -race ./internal/coding/execution/... ./internal/coding/approval/... ./internal/coding/changes/... ./internal/coding/tools/...
      - name: Test real Linux sandbox
        run: |
          PIPS_SANDBOX_INTEGRATION=1 bash .github/scripts/go-test.sh -race \
            ./internal/coding/execution/... ./internal/coding/changes/git ./internal/coding/tools \
            -run 'Darwin.*Integration|Linux.*Integration|GitIntegration|ShellIntegration|CodingFlowIntegration' \
            -count=3

  macos:
    name: macOS sandbox (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test execution package
        run: bash .github/scripts/go-test.sh -race ./internal/coding/execution/... ./internal/coding/approval/... ./internal/coding/changes/... ./internal/coding/tools/...
      - name: Test real macOS sandbox
        run: |
          PIPS_SANDBOX_INTEGRATION=1 bash .github/scripts/go-test.sh -race \
            ./internal/coding/execution/... ./internal/coding/changes/git ./internal/coding/tools \
            -run 'Darwin.*Integration|Linux.*Integration|GitIntegration|ShellIntegration|CodingFlowIntegration' \
            -count=3
