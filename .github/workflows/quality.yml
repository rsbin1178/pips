name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-plugins:
    name: Agent Plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mcp_runtime: true
          - os: macos-latest
            mcp_runtime: true
          - os: windows-latest
            mcp_runtime: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable Agent Harness
        shell: bash
        run: bash .github/scripts/go-test.sh -count=1 ./agent/harness
      - name: Test portable Agent Plugin loading
        if: always()
        shell: bash
        run: bash .github/scripts/go-test.sh -count=1 ./internal/coding/agentplugin
      - name: Test MCP runtime
        if: always() && matrix.mcp_runtime
        shell: bash
        run: bash .github/scripts/go-test.sh -count=1 ./internal/coding/execution/mcpstdio
      - name: Test platform and HTTP integration semantics
        if: always()
        run: |
          go test -count=1 ./internal/coding/execution -run '^TestEnvironmentNamesEqualUsesPlatformSemantics$'
          go test -count=1 ./internal/coding/mcp -run '^TestConfiguredHeadersNeverCrossOriginRedirect$'

  verify:
    name: Go quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install external sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1"; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        run: bash .github/scripts/go-test.sh ./...
      - name: Race-test Agent and Coding
        run: bash .github/scripts/go-test.sh -race ./agent/... ./internal/coding/...
      - name: Provider adapter and scripted smoke
        run: make provider-smoke
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...
      - name: Build
        run: go build ./...
      - name: Verify modules
        run: go mod verify
      - name: Audit reachable vulnerabilities
        run: go tool govulncheck ./...
      - name: Check core dependency direction
        run: make deps-check
