name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-plugins:
    name: Agent Plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable package and MCP runtime
        run: go test -count=1 ./agent/harness ./internal/coding/agentplugin ./internal/coding/execution/mcpstdio
      - name: Test platform and HTTP integration semantics
        run: |
          go test -count=1 ./internal/coding/execution -run '^TestEnvironmentNamesEqualUsesPlatformSemantics$'
          go test -count=1 ./internal/coding/mcp -run '^TestConfiguredHeadersNeverCrossOriginRedirect$'

  verify:
    name: Go quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race-test Agent and Coding
        run: go test -race ./agent/... ./internal/coding/...
      - name: Provider adapter and scripted smoke
        run: make provider-smoke
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...
      - name: Build
        run: go build ./...
      - name: Verify modules
        run: go mod verify
      - name: Audit reachable vulnerabilities
        run: go tool govulncheck ./...
      - name: Check core dependency direction
        run: make deps-check
