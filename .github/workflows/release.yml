name: Release

# Tags are the release trigger. The full quality gate runs in Quality on main,
# so this workflow re-checks the provider adapters and vet before publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # git describe resolves the stamped version from the tag history.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Print build stamp
        run: make version
      - name: Provider adapter and scripted smoke
        run: make provider-smoke
      - name: Vet
        run: go vet ./...
      - name: Build release artifacts
        run: make release
      - name: Verify the stamped binary
        run: |
          tar -xzf dist/pips_*_linux_amd64.tar.gz -C /tmp
          /tmp/pips_*_linux_amd64/pips version
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
      - name: Report manual build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cat dist/SHA256SUMS
